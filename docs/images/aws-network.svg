<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="17">
<title>AWS network: VPC, subnets, regional services</title>
<defs>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E8590C"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker>
<style>
.m{font-family:'IBM Plex Mono','DejaVu Sans Mono',monospace;font-size:16px}
.t{font-weight:600;font-size:20px}
.b{fill:#FBF9F5;stroke:#1A1A1A;stroke-width:1.5}
.z{fill:none;stroke:#1A1A1A;stroke-width:1.5}
.r{fill:none;stroke:#D6D0C4;stroke-width:1.5}
.o{fill:none;stroke:#E8590C;stroke-width:2.5}
.i{fill:none;stroke:#1A1A1A;stroke-width:1.5}
.bd{fill:#E8590C}.bn{fill:#fff;font-weight:700;font-size:16px;text-anchor:middle}
text{fill:#1A1A1A}.d{fill:#5b564c}
</style>
</defs>
<rect width="1600" height="1000" fill="#F4F1EA"/>

<rect class="b" x="700" y="10" width="200" height="45" rx="6"/><text x="800" y="40" text-anchor="middle" class="t">Internet</text>
<rect class="b" x="660" y="110" width="280" height="50" rx="6"/><text x="800" y="142" text-anchor="middle" class="t">Internet Gateway</text>
<path class="o" d="M800 55V108" marker-end="url(#ao)"/>

<!-- VPC -->
<rect class="z" x="40" y="180" width="1520" height="620" rx="6"/>
<text x="60" y="212" class="m" font-weight="600" font-size="20">VPC 10.0.0.0/16</text>
<text x="1540" y="212" text-anchor="end" class="d">NACL: allow all in and out, all subnets</text>
<path class="o" d="M800 160V214H1150V353" marker-end="url(#ao)"/>
<path class="i" d="M800 214H380V353" marker-end="url(#ai)"/>

<!-- AZ columns -->
<rect class="r" x="70" y="240" width="710" height="540" rx="6"/><text x="90" y="266" class="d" font-weight="600">AZ a</text>
<rect class="r" x="820" y="240" width="710" height="540" rx="6"/><text x="840" y="266" class="d" font-weight="600">AZ b</text>

<!-- public a -->
<rect class="z" x="90" y="275" width="670" height="225" rx="6"/>
<text x="110" y="305" class="m" font-weight="600">PUBLIC 10.0.0.0/24</text><text x="110" y="332" class="m d" style="font-size:15px">route 0.0.0.0/0 to IGW</text>
<rect class="b" x="110" y="355" width="310" height="125" rx="6"/>
<text x="130" y="388" class="t">Jenkins EC2</text><text x="130" y="418" class="m">t3.small</text><text x="130" y="448" class="d">SSH + 8080 from my IP only</text>
<rect class="b" x="450" y="355" width="290" height="125" rx="6"/>
<text x="470" y="388" class="t">NAT Gateway + EIP</text><text x="470" y="418" class="d">one NAT, shared by both</text><text x="470" y="446" class="d">private subnets</text>

<!-- public b -->
<rect class="z" x="840" y="275" width="670" height="225" rx="6"/>
<text x="860" y="305" class="m" font-weight="600">PUBLIC 10.0.1.0/24</text><text x="860" y="332" class="m d" style="font-size:15px">route 0.0.0.0/0 to IGW</text>
<rect class="b" x="860" y="355" width="630" height="125" rx="6"/>
<text x="880" y="388" class="t">Load balancer ENIs</text><text x="880" y="418" class="m" style="font-size:15px">kubernetes.io/role/elb=1</text><text x="880" y="448" class="d">Service type LoadBalancer :80, one per namespace</text>

<!-- private -->
<rect class="z" x="90" y="560" width="670" height="200" rx="6"/>
<text x="110" y="590" class="m" font-weight="600">PRIVATE 10.0.2.0/24</text><text x="110" y="617" class="m d" style="font-size:15px">route 0.0.0.0/0 to NAT</text>
<rect class="b" x="110" y="640" width="310" height="100" rx="6"/><text x="130" y="674" class="t">EKS worker node 1</text><text x="130" y="706" class="m">m7i-flex.large</text>
<rect class="z" x="840" y="560" width="670" height="200" rx="6"/>
<text x="860" y="590" class="m" font-weight="600">PRIVATE 10.0.3.0/24</text><text x="860" y="617" class="m d" style="font-size:15px">EKS managed ENIs</text>
<rect class="b" x="860" y="640" width="630" height="100" rx="6"/><text x="880" y="674" class="t">EKS worker node 2</text><text x="880" y="706" class="m">m7i-flex.large</text>

<!-- NAT egress, LB to node -->
<path class="i" d="M520 560V482" marker-end="url(#ai)" stroke-dasharray="5 4"/>
<text x="540" y="535" class="d">egress via NAT</text>
<path class="o" d="M1150 480V638" marker-end="url(#ao)"/>

<!-- badges -->
<circle class="bd" cx="800" cy="80" r="13"/><text class="bn" x="800" y="86">1</text>
<circle class="bd" cx="1000" cy="214" r="13"/><text class="bn" x="1000" y="220">2</text>
<circle class="bd" cx="1150" cy="530" r="13"/><text class="bn" x="1150" y="536">3</text>

<!-- regional -->
<text x="40" y="836" class="t">Outside the VPC (regional)</text>
<rect class="b" x="40" y="855" width="357" height="90" rx="6"/><text x="60" y="888" class="t">EKS control plane</text><text x="60" y="920" class="m">version 1.35</text>
<rect class="b" x="427" y="855" width="357" height="90" rx="6"/><text x="447" y="888" class="t">ECR</text><text x="447" y="920" class="d">9 repos, 3 services × 3 envs</text>
<rect class="b" x="814" y="855" width="357" height="90" rx="6"/><text x="834" y="888" class="t">KMS</text><text x="834" y="920" class="d">1 key, Vault auto-unseal</text>
<rect class="b" x="1201" y="855" width="357" height="90" rx="6"/><text x="1221" y="888" class="t">S3</text><text x="1221" y="920" class="d">Terraform state, native lockfile</text>

<text x="40" y="978" class="d"><tspan fill="#E8590C" font-weight="700">Orange</tspan> = inbound request path:  1 internet to IGW   2 IGW to load balancer ENIs   3 load balancer to EKS nodes</text>
</svg>
