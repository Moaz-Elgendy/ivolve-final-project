<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="17">
<title>Architecture: git push to pod</title>
<defs>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E8590C"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker>
<style>
.m{font-family:'IBM Plex Mono','DejaVu Sans Mono',monospace;font-size:16px}
.t{font-weight:600;font-size:20px}
.b{fill:#FBF9F5;stroke:#1A1A1A;stroke-width:1.5}
.z{fill:none;stroke:#1A1A1A;stroke-width:1.5}
.o{fill:none;stroke:#E8590C;stroke-width:2.5}
.i{fill:none;stroke:#1A1A1A;stroke-width:1.5}
.bd{fill:#E8590C}.bn{fill:#fff;font-weight:700;font-size:16px;text-anchor:middle}
text{fill:#1A1A1A}.d{fill:#5b564c}
</style>
</defs>
<rect width="1600" height="1000" fill="#F4F1EA"/>

<!-- top row -->
<rect class="b" x="60" y="120" width="160" height="80" rx="6"/><text x="140" y="167" text-anchor="middle" class="t">Developer</text>
<rect class="b" x="320" y="70" width="380" height="190" rx="6"/>
<text x="340" y="104" class="t">GitHub</text><text x="340" y="132" class="d">public repo, source of truth</text>
<g class="m" text-anchor="middle"><rect class="b" x="340" y="152" width="76" height="40" rx="6"/><text x="378" y="178">main</text>
<rect class="b" x="428" y="152" width="76" height="40" rx="6"/><text x="466" y="178">dev</text>
<rect class="b" x="516" y="152" width="76" height="40" rx="6"/><text x="554" y="178">stg</text>
<rect class="b" x="604" y="152" width="76" height="40" rx="6"/><text x="642" y="178">prod</text></g>
<text x="340" y="232" class="m d" style="font-size:16px">env branch holds imageTag</text>

<rect class="b" x="770" y="70" width="520" height="190" rx="6"/>
<text x="790" y="104" class="t">Jenkins</text><text x="880" y="104" class="d">one EC2, public subnet</text>
<rect class="b" x="790" y="140" width="120" height="60" rx="6"/><text x="850" y="177" text-anchor="middle">Build ×3</text>
<rect class="b" x="960" y="140" width="140" height="60" rx="6" stroke-dasharray="6 4"/><text x="1030" y="177" text-anchor="middle">Trivy scan</text>
<rect class="b" x="1150" y="140" width="120" height="60" rx="6"/><text x="1210" y="177" text-anchor="middle">Push</text>
<text x="1030" y="238" text-anchor="middle" class="d">report-only, does not block</text>

<rect class="b" x="1360" y="70" width="200" height="190" rx="6"/>
<text x="1380" y="104" class="t">Amazon ECR</text><text x="1380" y="132" class="d">9 repos</text>
<text x="1380" y="170" class="m">&lt;service&gt;-&lt;env&gt;</text>
<text x="1380" y="198" class="m d" style="font-size:14px">frontend-dev</text><text x="1380" y="220" class="m d" style="font-size:14px">auth-service-stg</text><text x="1380" y="242" class="m d" style="font-size:14px">roadmap-service-prod</text>

<!-- arrows top -->
<path class="o" d="M220 160H318" marker-end="url(#ao)"/>
<path class="o" d="M700 160H768" marker-end="url(#ao)"/>
<path class="o" d="M910 170H958" marker-end="url(#ao)"/>
<path class="o" d="M1100 170H1148" marker-end="url(#ao)"/>
<path class="o" d="M1290 170H1358" marker-end="url(#ao)"/>
<path class="o" d="M1030 70V34H560V68" marker-end="url(#ao)"/>
<path class="o" d="M450 260V378" marker-end="url(#ao)"/>
<path class="o" d="M1470 260V378" marker-end="url(#ao)"/>

<!-- EKS -->
<rect class="z" x="40" y="330" width="1520" height="510" rx="6"/>
<text x="60" y="362" class="t">EKS cluster</text><text x="215" y="362" class="d">private subnets</text>
<rect class="b" x="70" y="380" width="410" height="90" rx="6"/>
<text x="90" y="412" class="m">ns argocd</text><text x="90" y="440">Argo CD, polls env branch</text>
<rect class="b" x="70" y="520" width="410" height="120" rx="6"/>
<text x="90" y="552" class="m">ns vault</text><text x="90" y="580">Vault, KMS auto-unseal</text><text x="90" y="608">Agent injector adds sidecars</text>
<rect class="b" x="70" y="680" width="410" height="100" rx="6"/>
<text x="90" y="712" class="m">ns monitoring</text><text x="90" y="742">Prometheus + Grafana</text>

<rect class="b" x="560" y="380" width="960" height="400" rx="6"/>
<text x="580" y="412" class="m">ns ivolve-dev | ivolve-stg | ivolve-prod</text>
<text x="1500" y="412" text-anchor="end" class="d">same layout in each</text>
<rect class="b" x="590" y="440" width="190" height="80" rx="6"/><text x="685" y="475" text-anchor="middle">frontend</text><text x="685" y="500" text-anchor="middle" class="d">1 dev·stg, 2 prod</text>
<rect class="b" x="860" y="440" width="190" height="80" rx="6"/><text x="955" y="475" text-anchor="middle">auth</text><text x="955" y="500" text-anchor="middle" class="d">1 dev·stg, 2 prod</text>
<rect class="b" x="1130" y="440" width="360" height="80" rx="6"/><text x="1310" y="475" text-anchor="middle">mysql StatefulSet</text><text x="1310" y="500" text-anchor="middle" class="d">EBS gp3 volume</text>
<rect class="b" x="860" y="590" width="190" height="80" rx="6"/><text x="955" y="625" text-anchor="middle">roadmap</text><text x="955" y="650" text-anchor="middle" class="d">1 dev·stg, 2 prod</text>
<rect class="b" x="590" y="700" width="260" height="56" rx="6"/><text x="720" y="734" text-anchor="middle">LoadBalancer :80</text>
<text x="1490" y="740" text-anchor="end" class="d">Vault Agent sidecars</text><text x="1490" y="764" text-anchor="end" class="d">NetworkPolicies, resource limits</text>
<path class="i" d="M780 480H858" marker-end="url(#ai)"/>
<path class="i" d="M1050 480H1128" marker-end="url(#ai)"/>
<path class="i" d="M735 520V630H858" marker-end="url(#ai)"/>
<path class="i" d="M640 700V522" marker-end="url(#ai)"/>
<path class="o" d="M480 425H558" marker-end="url(#ao)"/>
<path class="i" d="M480 580H558" marker-end="url(#ai)" stroke-dasharray="5 4"/>
<path class="i" d="M480 730H558" marker-end="url(#ai)" stroke-dasharray="5 4"/>

<!-- browser -->
<rect class="b" x="590" y="890" width="260" height="60" rx="6"/><text x="720" y="927" text-anchor="middle" class="t">Browser</text>
<path class="i" d="M720 890V758" marker-end="url(#ai)"/>

<!-- badges -->
<g>
<circle class="bd" cx="269" cy="160" r="13"/><text class="bn" x="269" y="166">1</text>
<circle class="bd" cx="734" cy="160" r="13"/><text class="bn" x="734" y="166">2</text>
<circle class="bd" cx="935" cy="170" r="13"/><text class="bn" x="935" y="176">3</text>
<circle class="bd" cx="1324" cy="170" r="13"/><text class="bn" x="1324" y="176">4</text>
<circle class="bd" cx="800" cy="34" r="13"/><text class="bn" x="800" y="40">5</text>
<circle class="bd" cx="450" cy="300" r="13"/><text class="bn" x="450" y="306">6</text>
<circle class="bd" cx="519" cy="425" r="13"/><text class="bn" x="519" y="431">7</text>
<circle class="bd" cx="1470" cy="300" r="13"/><text class="bn" x="1470" y="306">8</text>
</g>

<!-- key -->
<g font-size="17">
<g transform="translate(900 884)">
<circle class="bd" cx="10" cy="-5" r="10"/><text class="bn" x="10" y="1" font-size="14">1</text><text x="30" y="0">git push to env branch</text>
<circle class="bd" cx="10" cy="25" r="10"/><text class="bn" x="10" y="31" font-size="14">2</text><text x="30" y="30">checkout, docker build ×3</text>
<circle class="bd" cx="10" cy="55" r="10"/><text class="bn" x="10" y="61" font-size="14">3</text><text x="30" y="60">trivy scan (report-only)</text>
<circle class="bd" cx="10" cy="85" r="10"/><text class="bn" x="10" y="91" font-size="14">4</text><text x="30" y="90">docker push to ECR</text>
<circle class="bd" cx="340" cy="-5" r="10"/><text class="bn" x="340" y="1" font-size="14">5</text><text x="360" y="0">commit imageTag to env branch</text>
<circle class="bd" cx="340" cy="25" r="10"/><text class="bn" x="340" y="31" font-size="14">6</text><text x="360" y="30">Argo CD polls the branch</text>
<circle class="bd" cx="340" cy="55" r="10"/><text class="bn" x="340" y="61" font-size="14">7</text><text x="360" y="60">Argo CD applies the chart</text>
<circle class="bd" cx="340" cy="85" r="10"/><text class="bn" x="340" y="91" font-size="14">8</text><text x="360" y="90">kubelet pulls the image</text>
</g></g>
<text x="40" y="940" class="d">dev/stg auto-sync · prod manual</text>
<text x="40" y="968" class="d">Orange = deploy path</text>
</svg>
