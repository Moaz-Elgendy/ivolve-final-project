---
- name: Install Docker
  ansible.builtin.dnf:
    name: docker
    state: present

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  notify: Restart Jenkins if present

# Restart now, not at play end, so a later failing role cannot skip it
- name: Apply docker group to running Jenkins
  ansible.builtin.meta: flush_handlers
