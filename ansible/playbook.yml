---
- name: Provision Jenkins server
  hosts: jenkins
  become: true
  pre_tasks:
    - name: Update dnf cache
      ansible.builtin.dnf:
        update_cache: true

    - name: Upgrade all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest

  roles:
    - jenkins
    - docker
    - trivy
