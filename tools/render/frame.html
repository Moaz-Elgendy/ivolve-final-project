<!doctype html>
<meta charset="utf-8">
<style>
html,body{margin:0;background:#F4F1EA}
body{width:__W__px;height:__H__px;box-sizing:border-box;padding:48px;color:#1A1A1A;
 font-family:"IBM Plex Mono","DejaVu Sans Mono",monospace}
.label{display:flex;align-items:center;gap:10px;height:18px;margin-bottom:20px;
 font-size:13px;letter-spacing:.04em;line-height:18px}
.label i{width:8px;height:8px;border-radius:50%;background:#E8590C;display:block}
.row{display:flex;gap:__GAP__px;justify-content:center}
.col{width:__CW__px}
.cap{font-size:12px;letter-spacing:.06em;color:#1A1A1A;height:16px;line-height:16px;margin-bottom:8px;opacity:.7}
.shot{width:__CW__px;height:__CH__px;overflow:hidden;border:1px solid #1A1A1A;box-sizing:content-box;
 box-shadow:0 6px 20px rgba(26,26,26,.14);background:#1A1A1A}
.shot img{display:block;width:__IW__px;margin-left:__ML__px;margin-top:__MT__px}
.term{width:__CW__px;margin:0 auto;background:#1A1A1A;border-radius:6px;overflow:hidden;box-shadow:0 6px 20px rgba(26,26,26,.25)}
.term .bar{height:30px;display:flex;align-items:center;gap:7px;padding:0 12px;color:#8d887c;font-size:12px}
.term .bar b{width:9px;height:9px;border-radius:50%;background:#4a4742;display:block}
.term .bar span{margin-left:8px}
.term img{display:block;width:__CW__px}
</style>
