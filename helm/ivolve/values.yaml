# Everything a template reads comes from here (.Values.*)

# Set by the Argo Application (helm parameter) so the AWS account ID stays out of git
registry: ""
# Set in values-<env>.yaml: dev | stg | prod. Images are <registry>/<image>-<environment>:<imageTag>
environment: ""
# Jenkins writes the build number into values-<env>.yaml after each build
imageTag: ""

frontend:
  image: frontend
  replicas: 2
  port: 3000
  serviceType: LoadBalancer
  sessionAffinitySeconds: 3600   # matches the 1h session cookie
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}

auth:
  image: auth-service
  replicas: 2
  port: 5000
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}

roadmap:
  image: roadmap-service
  replicas: 2
  port: 8080
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

mysql:
  image: mysql:8.0
  storageClass: gp3
  storage: 5Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 1Gi}

# Ingress isolation: only frontend is reachable from outside; auth and roadmap
# accept only the frontend; mysql accepts only auth. Enforced by the VPC CNI.
networkPolicy:
  enabled: true

# Non-secret DB settings; user/password come from Vault
db:
  host: mysql
  port: "3306"
  name: ivolve

vault:
  enabled: true
  role: ivolve
  # Raw Vault template syntax. It lives in values (not in templates/) because
  # Helm would try to render the {{ }} itself.
  dbSecretPath: secret/data/ivolve/db
  dbTemplate: |
    {{- with secret "secret/data/ivolve/db" -}}
    export DB_USER="{{ .Data.data.user }}"
    export DB_PASSWORD="{{ .Data.data.password }}"
    export DB_NAME="{{ .Data.data.name }}"
    export MYSQL_USER="{{ .Data.data.user }}"
    export MYSQL_PASSWORD="{{ .Data.data.password }}"
    export MYSQL_DATABASE="{{ .Data.data.name }}"
    export MYSQL_ROOT_PASSWORD="{{ .Data.data.root_password }}"
    {{- end }}
  frontendSecretPath: secret/data/ivolve/frontend
  frontendTemplate: |
    {{- with secret "secret/data/ivolve/frontend" -}}
    export SESSION_SECRET="{{ .Data.data.session_secret }}"
    {{- end }}
