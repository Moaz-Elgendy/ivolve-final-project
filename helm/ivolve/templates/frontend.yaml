apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "ivolve.labels" (dict "name" "frontend" "root" .) | nindent 4 }}
spec:
  type: {{ .Values.frontend.serviceType }}
  # Sessions live in each pod's memory, so one browser must keep hitting one pod
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: {{ .Values.frontend.sessionAffinitySeconds }}
  ports:
    - port: 80
      targetPort: {{ .Values.frontend.port }}
  selector:
    {{- include "ivolve.selector" (dict "name" "frontend" "root" .) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "ivolve.labels" (dict "name" "frontend" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "ivolve.selector" (dict "name" "frontend" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ivolve.labels" (dict "name" "frontend" "root" .) | nindent 8 }}
      {{- if .Values.vault.enabled }}
      annotations:
        {{- include "ivolve.vaultAnnotations" (dict "root" . "file" "frontend" "path" .Values.vault.frontendSecretPath "template" .Values.vault.frontendTemplate) | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: frontend
      containers:
        - name: frontend
          image: {{ include "ivolve.image" (dict "name" .Values.frontend.image "root" .) | quote }}
          command: ["sh", "-c", ". /vault/secrets/frontend && exec npm start"]
          env:
            - name: AUTH_SERVICE_URL
              value: "http://auth:{{ .Values.auth.port }}"
            - name: ROADMAP_SERVICE_URL
              value: "http://roadmap:{{ .Values.roadmap.port }}"
          ports:
            - containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.frontend.port }}
          securityContext:
            {{- include "ivolve.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
