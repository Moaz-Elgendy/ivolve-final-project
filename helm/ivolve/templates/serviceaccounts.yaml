# Vault's Kubernetes auth identifies a pod by its ServiceAccount, so each
# workload that reads secrets gets its own.
{{- range $name := list "frontend" "auth" "mysql" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "ivolve.labels" (dict "name" $name "root" $) | nindent 4 }}
{{- end }}
