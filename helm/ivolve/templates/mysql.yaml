apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    {{- include "ivolve.labels" (dict "name" "mysql" "root" .) | nindent 4 }}
spec:
  clusterIP: None   # headless: required by the StatefulSet, DNS name "mysql"
  ports:
    - port: 3306
  selector:
    {{- include "ivolve.selector" (dict "name" "mysql" "root" .) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels:
    {{- include "ivolve.labels" (dict "name" "mysql" "root" .) | nindent 4 }}
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      {{- include "ivolve.selector" (dict "name" "mysql" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ivolve.labels" (dict "name" "mysql" "root" .) | nindent 8 }}
      {{- if .Values.vault.enabled }}
      annotations:
        {{- include "ivolve.vaultAnnotations" (dict "root" . "file" "db" "path" .Values.vault.dbSecretPath "template" .Values.vault.dbTemplate) | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: mysql
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          # Load the Vault-rendered env file, then start the image's normal entrypoint
          command: ["sh", "-c", ". /vault/secrets/db && exec docker-entrypoint.sh mysqld"]
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mysql   # a fresh ext4 EBS volume holds lost+found, which makes mysqld refuse to initialize
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.mysql.storageClass }}
        resources:
          requests:
            storage: {{ .Values.mysql.storage }}
