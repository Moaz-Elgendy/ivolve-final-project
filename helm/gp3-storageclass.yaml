# Apply once: kubectl apply -f helm/gp3-storageclass.yaml
# EKS 1.35 has no in-tree EBS provisioner, so PVCs need a StorageClass backed by the EBS CSI driver.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
